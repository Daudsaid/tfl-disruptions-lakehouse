name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test (incl. Spark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --frozen --group spark

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v

  # Only rebuild images when something that affects them changes.
  changes:
    name: Detect Docker changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  docker-build:
    name: Build Docker images
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build poller spark-bronze dashboard
