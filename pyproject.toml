[project]
name = "tfl-disruptions-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
]

[dependency-groups]
dashboard = [
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
]
dev = [
    "chispa>=0.12.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
spark = [
    "delta-spark==4.0.*",
    "pyspark==4.0.*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
